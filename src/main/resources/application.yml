spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 文件存储目录，可通过环境变量 ONCLOUD_UPLOAD_DIR 覆盖
oncloud:
  upload-dir: ${ONCLOUD_UPLOAD_DIR:./FileLibrary}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.oncloud: info
